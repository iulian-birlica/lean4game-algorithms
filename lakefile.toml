name = "Game"
defaultTargets = ["Game"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[require]]
name = "GameServer"
scope = "hhu-adam"
path = "vendor/lean4game/server"

[[lean_lib]]
name = "Game"
srcDir = "Game"
globs = ["Game.+"]
moreLeanArgs = ["-Dtrace.debug=false"]

[lean_lib.leanOptions]
linter.all = false
pp.showLetValues = true
tactic.hygienic = false
maxHeartbeats = 8000000
maxRecDepth = 4000

[lean_lib.moreServerOptions]
trace.debug = true
